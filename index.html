<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="Sketch roadbook tulips with one hand. Keep pictures, text and voice at every point.">
<title>RallyMaker · Roadbook notes</title>
<link rel="icon" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
</head><body>
<div id="tulip-thumb-flow">
  <main class="tt-phone" aria-label="Roadbook note maker" inert>
    <header class="tt-top"><button class="tt-open-points" type="button" aria-label="Open saved points"><span class="tt-point-title">New point</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><span class="tt-save-state" role="status" aria-live="polite">Opening…</span><button class="tt-open-menu" type="button" aria-label="Point options"><i data-lucide="more-horizontal" aria-hidden="true"></i></button></header>
    <div class="tt-paper">
      <svg class="tt-sketch" role="img" aria-label="Smooth roadbook tulip. Tap a road to select it, drag a visible handle to reshape, or draw a new branch."></svg>
      <div class="tt-message" role="status" aria-live="polite">Draw a fork. Tap a road to edit.</div>
      <button class="tt-quick" type="button" hidden><span>Road added</span><strong>Undo</strong></button>
      <button type="button" class="tt-note-record-mini" hidden aria-label="Stop voice recording"><i data-lucide="square" aria-hidden="true"></i><span>Recording</span><span class="tt-note-record-time">0:00</span><span>Stop</span></button>
    </div>
    <div class="tt-accessory">
    <div class="tt-landmarks" aria-label="Favourite landmarks">
      <div class="tt-favourites" role="group" aria-label="Your four favourite landmarks">
        <button type="button" data-feature="house" aria-pressed="false"><i data-lucide="house" aria-hidden="true"></i><span>House</span></button>
        <button type="button" data-feature="hedge" aria-pressed="false"><i data-lucide="trees" aria-hidden="true"></i><span>Hedge</span></button>
        <button type="button" data-feature="bank" aria-label="Sandbank" aria-pressed="false"><i data-lucide="mountain" aria-hidden="true"></i><span>Bank</span></button>
        <button type="button" data-feature="water" aria-label="Waterline" aria-pressed="false"><i data-lucide="waves" aria-hidden="true"></i><span>Waterline</span></button>
      </div>
      <button type="button" class="tt-arrange" aria-label="More landmarks" aria-expanded="false"><i data-lucide="grid-2x2" aria-hidden="true"></i><span>More</span></button>
    </div>
    <div class="tt-context" hidden>
      <button type="button" data-surface="tarmac" aria-pressed="true">Tarmac</button>
      <button type="button" data-surface="gravel" aria-pressed="false">Gravel</button>
      <button type="button" data-surface="track" aria-pressed="false">Track</button>
      <button type="button" class="tt-delete" aria-label="Delete selected road"><i data-lucide="trash-2" aria-hidden="true"></i><span>Delete</span></button>
    </div>
    <div class="tt-feature-context" hidden>
      <span class="tt-feature-label">Landmark</span>
      <button type="button" class="tt-flip"><i data-lucide="flip-vertical-2" aria-hidden="true"></i><span>Flip side</span></button>
      <button type="button" class="tt-feature-delete" aria-label="Delete selected landmark"><i data-lucide="trash-2" aria-hidden="true"></i><span>Delete</span></button>
    </div>
    </div>
    <div class="tt-picker" role="dialog" aria-label="Landmarks" hidden>
      <div class="tt-picker-head"><strong>Landmarks</strong><button type="button" class="tt-picker-close" aria-label="Close landmarks"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <label class="tt-search-label"><i data-lucide="search" aria-hidden="true"></i><input class="tt-landmark-search" type="search" placeholder="Search landmarks" aria-label="Search landmarks"></label>
      <div class="tt-favourites-heading"><span>Favourites</span><button type="button" class="tt-picker-manage" aria-label="Edit favourites" aria-pressed="false">Edit</button></div>
      <div class="tt-picker-favourites" role="group" aria-label="Favourite landmark slots"></div>
      <div class="tt-reorder-bar" hidden>
        <span class="tt-reorder-label">Rearrange</span>
        <button type="button" class="tt-order-left" aria-label="Move favourite left"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <button type="button" class="tt-order-right" aria-label="Move favourite right"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
      </div>
      <div class="tt-picker-hint" role="status" aria-live="polite">Tap a symbol to use it.</div>
      <div class="tt-picker-results" role="group" aria-label="Landmark collection"></div>
    </div>
    <div class="tt-add" role="dialog" aria-label="Point note" hidden>
      <div class="tt-sheet-head"><strong>Note</strong><button type="button" class="tt-close" aria-label="Close note"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <label>Text<textarea class="tt-note-text" rows="3" placeholder="A sign, a landmark, something to remember…"></textarea></label>
      <div class="tt-note-capture">
        <button type="button" class="tt-note-photo"><i data-lucide="camera" aria-hidden="true"></i><span>Photo</span></button>
        <button type="button" class="tt-note-voice" aria-pressed="false"><i data-lucide="mic" aria-hidden="true"></i><span class="tt-note-voice-label">Voice</span></button>
      </div>
      <div class="tt-note-attachments" aria-label="Photos and voice notes" hidden></div>
      <div class="tt-note-footer"><span class="tt-note-status" role="status" aria-live="polite">Photos and voice stay with this point.</span><button type="button" class="tt-note-audio"><i data-lucide="paperclip" aria-hidden="true"></i><span>Attach audio</span></button></div>
      <input class="tt-note-photo-input" type="file" accept="image/*" capture="environment" multiple hidden>
      <input class="tt-note-audio-input" type="file" accept="audio/*" hidden>
    </div>
    <div class="tt-dock">
      <button type="button" class="tt-pen" aria-pressed="true"><i data-lucide="pen-line" aria-hidden="true"></i><span>Pen</span></button>
      <button type="button" class="tt-undo"><i data-lucide="undo-2" aria-hidden="true"></i><span>Undo</span></button>
      <button type="button" class="tt-clear" aria-label="Clear sketch"><i data-lucide="eraser" aria-hidden="true"></i><span>Clear</span></button>
      <button type="button" class="tt-more" aria-expanded="false"><i data-lucide="sticky-note" aria-hidden="true"></i><span>Note</span><span class="tt-note-count" hidden></span></button>
      <button type="button" class="tt-done"><i data-lucide="check" aria-hidden="true"></i><span>Done</span></button>
    </div>
    <section class="tt-book tt-app-sheet" role="dialog" aria-label="Saved roadbook points" hidden>
      <div class="tt-sheet-head"><strong>Points</strong><button type="button" data-close-sheet aria-label="Close points"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="tt-point-list"></div><button class="tt-new-point tt-primary" type="button"><i data-lucide="plus" aria-hidden="true"></i>New point</button>
    </section>
    <section class="tt-options tt-app-sheet" role="dialog" aria-label="Point options" hidden>
      <div class="tt-sheet-head"><strong>Options</strong><button type="button" data-close-sheet aria-label="Close options"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <button class="tt-gps-toggle" type="button" aria-pressed="false"><i data-lucide="map-pin" aria-hidden="true"></i><span>Enable GPS for new points</span></button>
      <button class="tt-backup" type="button"><i data-lucide="download" aria-hidden="true"></i>Download complete backup</button>
      <button class="tt-import" type="button"><i data-lucide="upload" aria-hidden="true"></i>Import backup</button>
      <button class="tt-svg" type="button"><i data-lucide="download" aria-hidden="true"></i>Download this tulip · SVG</button>
      <p class="tt-options-status" role="status">Points and attachments stay on this device. A backup lets you move them to another device.</p>
      <p class="tt-version">RallyMaker · 3.1</p>
      <input class="tt-import-input" type="file" accept="application/json,.json" hidden>
    </section>
    <section class="tt-review tt-app-sheet" role="dialog" aria-label="Review this roadbook point" hidden>
      <div class="tt-sheet-head"><strong class="tt-review-title">Point</strong><button type="button" data-close-sheet aria-label="Back to sketch"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="tt-review-tulip"></div>
      <label>Total distance · km<input class="tt-trip" type="number" min="0" max="100000" step="0.001" inputmode="decimal" placeholder="Trip-meter reading (optional)"></label>
      <div class="tt-review-text"></div><div class="tt-anchor"></div>
      <button class="tt-keep-next tt-primary" type="button">Next point<i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
    </section>
    <div class="tt-app-notice" role="status" aria-live="polite" hidden></div>
  </main>
</div>
<script src="./icons.js" defer></script><script src="./store.js" defer></script><script src="./editor.js" defer></script><script src="./note-media.js" defer></script><script src="./app.js" defer></script>
</body></html>
